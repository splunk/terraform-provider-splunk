[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "issue-agent"
version = "0.1.0"
description = "Disposition, implementation, and review orchestration for the Splunk Terraform provider."
requires-python = ">=3.10"
dependencies = [
  "cursor-sdk==1.0.37",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
]

[project.scripts]
issue-agent = "issue_agent.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
issue_agent = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
