name: Feature request
description: Request a provider change
title: "[Feature]: "
labels: []
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What should the provider do?
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Terraform, provider, and Splunk Enterprise versions you use.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How will a change be verified, and which existing configurations must keep applying unchanged?
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility
      description: Would this change schema, defaults, resource identity, import format, or behavior of configurations that already apply?
    validations:
      required: true
