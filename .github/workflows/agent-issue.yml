name: agent-issue

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Open issue number
        required: true
        type: string
      mode:
        description: Review the issue, or review it and open one draft pull request
        required: true
        default: review-only
        type: choice
        options:
          - review-only
          - review-and-fix

concurrency:
  group: issue-agent-${{ inputs.issue_number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  agent-issue:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Install orchestrator
        run: |
          pip install -r tools/issue_agent/requirements.lock
          pip install --no-deps -e tools/issue_agent
      - name: Review or fix one issue
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          ISSUE_AGENT_MODE: ${{ inputs.mode }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python tools/issue_agent/scripts/run_issue.py
